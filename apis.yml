name: AND Global
description: 'AND Global is a fintech-as-a-service company operating across the Asia-Pacific
  region, with offices in Mongolia, Singapore, Japan, the Philippines, and Thailand.
  It builds software that lets banks and lenders launch digital lending and financial
  products, integrating with banking and payment systems through APIs and other means.
  Its solutions span automated lending lifecycle management (Looms), custom and AI/ML
  credit scoring (Scorecard Builder, Custom AI Scoring, Niko AutoML), intelligent
  document processing (Mindox), omnichannel customer data, document management (DMS),
  and a collaborative investment platform (Oasis). Consumer-facing brands include
  the LendMN and Lend Pinoy digital lending platforms. AND Global was added to the
  API Evangelist network as a Techstars portfolio company; no public developer portal
  or API documentation was found at profiling time.'
